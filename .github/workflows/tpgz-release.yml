name: TPGZ Release Automation

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

jobs:
  build-patches:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20240702
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: GCN
            region: NTSCU
          - platform: GCN
            region: PAL
          - platform: GCN
            region: NTSCJ
          - platform: WII
            region: NTSCU_10
          - platform: WII
            region: NTSCU_12
          - platform: WII
            region: PAL

    name: Build ${{ matrix.platform }}-${{ matrix.region }} Patch
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-yaml

      - name: Configure and build patch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          mkdir build
          cd build
          cmake .. -DPLATFORM=${{ matrix.platform }} -DREGION=${{ matrix.region }} -DTPGZ_BUILD_VERSION="$VERSION"
          make -j$(nproc) patch

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-${{ matrix.platform }}-${{ matrix.region }}
          path: build/*.patch
          if-no-files-found: error

  release:
    needs: build-patches
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all patches
        uses: actions/download-artifact@v4
        with:
          pattern: patch-*
          path: patches
          merge-multiple: true

      - name: Create release with patches
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: patches/*.patch
